name: DataBridge CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend-tests:
    name: Python tests and benchmark smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app benchmark.py
      - run: python -m pytest -q
      - run: python benchmark.py --rows 20 --repeats 1
  frontend-build:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No lockfile in v0.5: install dependencies, then run the actual tsc/Vite build.
      # Generate and commit a package-lock.json before switching this to npm ci.
      - run: npm install --no-audit --no-fund
      - run: npm run build
  docker-build:
    name: Backend Docker build (benchmark packaged)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag databridge-backend-ci ./backend
      - run: docker run --rm databridge-backend-ci python benchmark.py --rows 10 --repeats 1
